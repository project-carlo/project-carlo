[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-extract"
version = "0.1.0"
description = "Fetch parish bulletins and process schedules with Gemini."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12.5",
    "playwright>=1.55.0",
    "google-genai>=1.65.0",
    "openai>=3.23.0",
    "playwright-stealth>=2.0.2",
    "pypdf>=6.19.0",
    "boto3>=1.43.102",
    "pyyaml>=6.0.3",
    "pypdfium2>=5.13.0",
    "pillow>=12.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_extract"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "moto[s3]>=5.2.3",
    "pytest>=9.0.3",
    "ruff>=0.15.2",
]
# The onboarding factory's dispatcher (`pnpm factory`), which starts Agent SDK workers.
factory = [
    "claude-agent-sdk>=0.2.174",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Defaults (pycodestyle errors + pyflakes) plus import sorting, so import
# blocks stay in one order without anyone having to notice.
extend-select = ["I"]
