[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-extract"
version = "0.1.0"
description = "Fetch parish bulletins and process schedules with Gemini."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12.5",
    "playwright>=1.55.0",
    "google-genai>=1.65.0",
    "openai>=1.55.0",
    "playwright-stealth>=2.0.2",
    "pypdf>=6.10.2",
    "boto3>=1.43.102",
    "pyyaml>=6.0.3",
]

# Docling's torch from PyTorch's CPU index on Linux, where PyPI's torch is the
# ~4 GB CUDA build; Windows and macOS wheels on PyPI are already CPU builds.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_extract"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "moto[s3]>=5.2.3",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]
# PDF → text extractors for `pnpm bench` (see pdf_extract.text_extractors).
bench = [
    "pymupdf>=1.26",
    # 3.x bundles its OCR models (no download at run time); they change across
    # minor releases, hence the upper bound.
    "rapidocr>=3.9.2,<4",
    "onnxruntime>=1.20",
    "numpy>=2.0",
    # Needs torch, which has no Intel-Mac wheels for Python 3.13; there the
    # docling stack is skipped and the others still run.
    "docling>=2.130,<3; sys_platform != 'darwin' or platform_machine == 'arm64'",
    # Listed only so the pytorch-cpu source below applies to them.
    "torch; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "torchvision; sys_platform != 'darwin' or platform_machine == 'arm64'",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Defaults (pycodestyle errors + pyflakes) plus import sorting, so import
# blocks stay in one order without anyone having to notice.
extend-select = ["I"]
