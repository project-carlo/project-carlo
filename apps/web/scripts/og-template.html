<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Cardo";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("../node_modules/@fontsource/cardo/files/cardo-latin-400-normal.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "Cardo";
        font-style: italic;
        font-weight: 400;
        font-display: block;
        src: url("../node_modules/@fontsource/cardo/files/cardo-latin-400-italic.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "EB Garamond";
        font-style: italic;
        font-weight: 400;
        font-display: block;
        src: url("../node_modules/@fontsource-variable/eb-garamond/files/eb-garamond-latin-wght-italic.woff2")
          format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      .grain::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        mix-blend-mode: multiply;
        opacity: 0.4;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.09  0 0 0 0 0.07  0 0 0 0 0.05  0 0 0 0.06 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      }
    </style>
  </head>
  <body>
    <!-- Google Search crops this image to a centred square (x 285-915) for
         its result thumbnails, so everything that matters stays inside it.
         The pin is the brand mark from public/favicon.svg, without its tile. -->
    <div
      id="og-frame"
      class="grain"
      style="
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: oklch(0.955 0.022 82);
        background-image:
          radial-gradient(
            ellipse 80% 62% at 50% 0%,
            color-mix(in oklch, oklch(0.97 0.02 82) 85%, white) 0%,
            transparent 70%
          ),
          radial-gradient(
            ellipse 120% 80% at 50% 100%,
            color-mix(in oklch, oklch(0.915 0.028 82) 65%, transparent) 0%,
            transparent 75%
          );
      "
    >
      <div
        style="
          position: absolute;
          inset: 36px;
          border: 1px solid
            color-mix(in oklch, oklch(0.2 0.015 50) 28%, transparent);
        "
      ></div>
      <div
        style="
          position: absolute;
          inset: 44px;
          border: 1px solid
            color-mix(in oklch, oklch(0.2 0.015 50) 13%, transparent);
        "
      ></div>
      <div
        style="
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 40px;
        "
      >
        <div style="display: flex; align-items: center; gap: 30px">
          <svg
            width="162"
            height="210"
            viewBox="12 6 40 52"
            aria-hidden="true"
          >
            <path
              fill="#9B2F25"
              d="M32 7c-10.8 0-19.5 8.7-19.5 19.5C12.5 40.1 32 57 32 57s19.5-16.9 19.5-30.5C51.5 15.7 42.8 7 32 7Z"
            />
            <path
              fill="#F3ECD8"
              d="m21.5 30.4 10.5-9 10.5 9V43c0 .8-.7 1.5-1.5 1.5H23c-.8 0-1.5-.7-1.5-1.5V30.4Z"
            />
            <path
              fill="none"
              stroke="#6D241E"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="m21.5 30.4 10.5-9 10.5 9"
            />
            <path fill="#6D241E" d="M28.5 34.5a3.5 3.5 0 0 1 7 0v10h-7v-10Z" />
            <path
              fill="none"
              stroke="#C6A04D"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="3"
              d="M32 15v10M27.5 20H36.5"
            />
          </svg>
          <h2
            style="
              font-family: Cardo, Georgia, serif;
              font-weight: 400;
              font-size: 110px;
              line-height: 0.88;
              letter-spacing: -0.02em;
              color: oklch(0.2 0.015 50);
              margin: 0;
            "
          >
            Project<br />
            <span style="font-style: italic; color: oklch(0.46 0.165 28)">Carlo</span>
          </h2>
        </div>
        <div
          style="
            font-family: 'EB Garamond', Georgia, serif;
            font-style: italic;
            letter-spacing: 0.01em;
            font-size: 29px;
            color: oklch(0.4 0.018 50);
          "
        >
          Mass, Confession &amp; Adoration times near you
        </div>
      </div>
    </div>
  </body>
</html>
