<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Cardo";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("../node_modules/@fontsource/cardo/files/cardo-latin-400-normal.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "Cardo";
        font-style: italic;
        font-weight: 400;
        font-display: block;
        src: url("../node_modules/@fontsource/cardo/files/cardo-latin-400-italic.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "EB Garamond";
        font-style: italic;
        font-weight: 400;
        font-display: block;
        src: url("../node_modules/@fontsource-variable/eb-garamond/files/eb-garamond-latin-wght-italic.woff2")
          format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      .grain::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        mix-blend-mode: multiply;
        opacity: 0.4;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.09  0 0 0 0 0.07  0 0 0 0 0.05  0 0 0 0.06 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      }
    </style>
  </head>
  <body>
    <!-- Google Search crops this image to a centred square (x 285-915) for
         its result thumbnails, so everything that matters stays inside it.
         The mark is a copy of public/favicon.svg. -->
    <div
      id="og-frame"
      class="grain"
      style="
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: oklch(0.955 0.022 82);
        background-image:
          radial-gradient(
            ellipse 80% 62% at 50% 0%,
            color-mix(in oklch, oklch(0.97 0.02 82) 85%, white) 0%,
            transparent 70%
          ),
          radial-gradient(
            ellipse 120% 80% at 50% 100%,
            color-mix(in oklch, oklch(0.915 0.028 82) 65%, transparent) 0%,
            transparent 75%
          );
      "
    >
      <div
        style="
          position: absolute;
          inset: 36px;
          border: 1px solid
            color-mix(in oklch, oklch(0.2 0.015 50) 28%, transparent);
        "
      ></div>
      <div
        style="
          position: absolute;
          inset: 44px;
          border: 1px solid
            color-mix(in oklch, oklch(0.2 0.015 50) 13%, transparent);
        "
      ></div>
      <div
        style="
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 40px;
        "
      >
        <div style="display: flex; align-items: center; gap: 30px">
          <svg width="200" height="200" viewBox="0 0 64 64" aria-hidden="true">
            <rect width="64" height="64" rx="14" fill="#9B2F25" />
            <mask id="c-opening" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
              <rect width="64" height="64" fill="#fff" />
              <path d="M32 26 68.94-21.28 90.46 12.5 85.93 52.3Z" />
            </mask>
            <path
              mask="url(#c-opening)"
              fill="none"
              stroke="#F3ECD8"
              stroke-width="7.5"
              stroke-linejoin="round"
              d="M32 9c-9.4 0-17 7.6-17 17 0 12 17 29 17 29s17-17 17-29c0-9.4-7.6-17-17-17Z"
            />
            <circle cx="42.46" cy="12.59" r="3.75" fill="#F3ECD8" />
            <circle cx="47.31" cy="33.43" r="3.75" fill="#F3ECD8" />
            <path fill="#E8C673" d="M30 16h4v5h5v4h-5v13h-4V25h-5v-4h5Z" />
          </svg>
          <h2
            style="
              font-family: Cardo, Georgia, serif;
              font-weight: 400;
              font-size: 110px;
              line-height: 0.88;
              letter-spacing: -0.02em;
              color: oklch(0.2 0.015 50);
              margin: 0;
            "
          >
            Project<br />
            <span style="font-style: italic; color: oklch(0.46 0.165 28)">Carlo</span>
          </h2>
        </div>
        <div
          style="
            font-family: 'EB Garamond', Georgia, serif;
            font-style: italic;
            letter-spacing: 0.01em;
            font-size: 29px;
            color: oklch(0.4 0.018 50);
          "
        >
          Mass, Confession &amp; Adoration times near you
        </div>
      </div>
    </div>
  </body>
</html>
