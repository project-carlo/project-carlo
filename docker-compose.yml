services:
  weekly-job:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    # Credentials pass through from your shell (`export ...` or `-e` on the command line).
    # Leave CARLO_REMOTE_WRITE unset locally: the run is pulled from R2 but its
    # candidate upload needs write keys, which only the weekly workflow holds.
    environment:
      - RUN_ID
      - GEMINI_API_KEY
      - R2_ACCOUNT_ID
      - R2_BUCKET
      - R2_ACCESS_KEY_ID
      - R2_SECRET_ACCESS_KEY
      - CARLO_REMOTE_WRITE
    volumes:
      - ./data:/workspace/data
    command: ["bash", "docker/weekly-run.sh"]
