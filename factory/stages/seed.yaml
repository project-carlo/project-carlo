stage: seed
kind: agent
model: claude-opus-5-5
effort: medium
prompt: factory/prompts/seed.md
skills: [draft-parish-seed]
tools: [Bash, Read, Grep, Edit, Write]
writes:
  - data/seeds/{parish}.json
  - scratch/{run}/{job}/**
# What its workers get from the dispatcher's .env: bulletins from R2. No model keys: the
# dispatcher makes the one model call a seed gets, its second opinion
# (docs/seed-second-opinion-plan.md). Scoped keys are a follow-up (factory-sandbox-plan.md).
secrets: [R2_*]
# `seed check` reads bulletins from R2.
gate_secrets: [R2_*]
gates:
  - pnpm seed check {parish}
limits: { max_turns: 150, max_minutes: 60 }
