stage: survey
kind: agent
model: claude-opus-5-5
effort: medium
prompt: factory/prompts/survey.md
skills: [explore-diocese, parish-site-access]
tools: [Bash, Read, Grep, Edit, Write]
writes:
  - data/dioceses/{diocese}/**
  - scratch/{run}/**
reads:
  - data/dioceses/README.md#The model
  - data/dioceses/README.md#Batch plans
  - data/dioceses/README.md#Sources
gates:
  - pnpm --silent diocese batches validate {diocese}
  - pnpm --silent diocese validate {diocese}
limits: { max_turns: 200, max_minutes: 120 }
