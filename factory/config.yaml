# The dispatcher's settings (docs/factory-spec.md). This machine's accounts and paths go
# in data/factory/local.yaml, which is not committed (see factory/local.example.yaml).

# Usage caps, in percent of each account's limit. A job starts on an account only if its
# usage plus the job's expected usage (job_usage), plus that of any jobs already running
# on it, stays under both caps.
five_hour_cap: 85
weekly_cap: 100   # paced: below weekly_cap × (days into the week + 1) ÷ 7

# What one attempt of a stage's job is expected to use, in points of each window: about
# the 75th percentile of past jobs (`pnpm factory quota`; one five-hour point ≈ $0.14 of
# the API-price cost). A stage not listed counts as 0. Map: a job starts below 75% five-hour.
job_usage:
  survey:        { five_hour: 40, weekly: 3 }
  survey-review: { five_hour: 8, weekly: 1 }
  map:           { five_hour: 10, weekly: 1 }
  integrate:     { five_hour: 5, weekly: 1 }
  reconcile:     { five_hour: 25, weekly: 2 }
  seed:          { five_hour: 10, weekly: 1 }   # no history yet: like map
  seed-review:   { five_hour: 15, weekly: 1 }   # no history yet: an Opus reviewer

max_send_backs: 2
lessons_before_integrate: 15   # integrate runs once more after the last batch

# A job's attempts. The Run blocks after max_crashes worker crashes, or after
# max_failures git or GitHub failures in a row (retried every failure_retry_minutes).
# A session that ends partway is continued max_continues times, then the Run blocks.
max_crashes: 3
max_continues: 1
max_failures: 3
failure_retry_minutes: 5
# How long the usage check waits after the endpoint answers 429 Too Many Requests.
usage_cooldown_minutes: 30

# Seed Runs (§11).
seed_ready_bulletins: 2
seed_first_run_share: 0.8
seed_follow_up_weeks: 6

# Quota readings (docs/factory-spec.md, Usage). calibration_gap_seconds > 0 holds the
# next job on an account that long after its last attempt, for calibration runs only.
quota_settle_seconds: 150
quota_sample_minutes: 15
calibration_gap_seconds: 0

# How often the dispatcher does each thing.
tick_seconds: 60
issue_poll_minutes: 10
readiness_check_hours: 24
backup_hour: 3          # local time; the nightly ledger backup to R2
backup_prefix: factory/backups/

base_branch: main
remote: origin
