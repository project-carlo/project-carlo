name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "data/**"
      # Deploys build the snapshot with the pipeline code.
      - "src/pdf_extract/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-web.yml"
  # Previews are on demand: adding the `preview` label to a pull request deploys
  # its latest commit. The run takes the label off when it ends, so adding it
  # again later deploys a fresh preview.
  pull_request:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose deploy to publish immediately or upload-version to create a Worker version without rollout."
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - upload-version

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.label.name == 'preview' && github.event.pull_request.head.repo.full_name == github.repository)

    # On the job, not the workflow, so adding some other label never cancels a
    # preview. Adding `preview` again cancels a preview still running for the
    # same branch; deploys on main queue instead.
    concurrency:
      group: web-deploy-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # The snapshot is built here, from the published database, by the code
      # being deployed: its format always matches this web code, and CSV edits
      # in this commit show up. Read-only R2 keys are enough.
      - name: Build data snapshot
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'project-carlo-data' }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail
          uv sync --frozen --no-dev
          uv run --no-sync python -m pdf_extract data snapshot | tee pulled.json
          {
            echo "### Data snapshot"
            echo '```json'
            cat pulled.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Type check web app
        run: pnpm --filter web check

      - name: Build web app
        run: pnpm --filter web build

      # `--with-deps` runs apt-get against the runner's Azure Ubuntu mirror,
      # which can stall with no output and no timeout, hanging the job until
      # the 30 minute limit. Make apt give up on a stalled connection and retry,
      # cache the browser download, and cap the step so a hang fails fast.
      - name: Configure apt for flaky mirrors
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci-network >/dev/null <<'EOF'
          Acquire::Retries "5";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        timeout-minutes: 10
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            pnpm --filter web exec playwright install-deps chromium
          else
            pnpm --filter web exec playwright install --with-deps chromium
          fi

      - name: Run Playwright smoke tests
        run: pnpm --filter web test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Prepare preview alias
        id: preview
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          alias="$(printf '%s' "$BRANCH_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/-+/-/g' \
            | cut -c1-48)"

          if [ -z "$alias" ]; then
            alias="branch-${GITHUB_SHA:0:7}"
          fi

          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      # Each deploy replaces the asset set, so pages loaded before it would 404
      # on their lazy chunks. This copies the last two weeks' retired assets
      # from the live site into the build; it warns instead of failing.
      - name: Carry over previous assets
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy' && github.ref_name == 'main') || (github.event_name == 'push' && github.ref_name == 'main')
        run: pnpm --filter web carry-assets

      - name: Deploy production web app
        id: production-deploy
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy' && github.ref_name == 'main') || (github.event_name == 'push' && github.ref_name == 'main')
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: apps/web
          packageManager: pnpm

      - name: Upload preview web app
        id: preview-deploy
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias ${{ steps.preview.outputs.alias }}
          workingDirectory: apps/web
          packageManager: pnpm

      - name: Upload manual web app version
        id: manual-version-upload
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'upload-version'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload
          workingDirectory: apps/web
          packageManager: pnpm

      - name: Resolve preview URL
        id: preview-url
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          COMMAND_OUTPUT: ${{ steps.preview-deploy.outputs.command-output }}
          COMMAND_STDERR: ${{ steps.preview-deploy.outputs.command-stderr }}
          PREVIEW_ALIAS: ${{ steps.preview.outputs.alias }}
        run: |
          set -uo pipefail

          # wrangler prints the URLs with colour codes, and splits stdout/stderr differently per version.
          output="$(printf '%s\n%s\n' "$COMMAND_OUTPUT" "$COMMAND_STDERR" | sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g')"

          pick() {
            printf '%s\n' "$output" \
              | grep -iE "$1" \
              | grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' \
              | head -n 1
          }

          alias_url="$(pick 'preview alias url' || true)"
          version_url="$(pick 'version preview url' || true)"

          if [ -z "$alias_url" ]; then
            alias_url="$(printf '%s\n' "$output" \
              | grep -oE "https://${PREVIEW_ALIAS}-[A-Za-z0-9._-]+\.workers\.dev" \
              | head -n 1 || true)"
          fi

          if [ -z "$version_url" ]; then
            version_url="$(printf '%s\n' "$output" \
              | grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' \
              | head -n 1 || true)"
          fi

          {
            echo "alias-url=$alias_url"
            echo "version-url=$version_url"
            echo "preview-url=${alias_url:-$version_url}"
          } >> "$GITHUB_OUTPUT"

      - name: Comment preview link on pull request
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIEW_URL: ${{ steps.preview-url.outputs.preview-url }}
          VERSION_URL: ${{ steps.preview-url.outputs.version-url }}
          PREVIEW_ALIAS: ${{ steps.preview.outputs.alias }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          marker='<!-- cloudflare-preview-link -->'

          if [ -z "$PREVIEW_URL" ]; then
            echo "No preview URL found in the wrangler output; skipping the pull request comment."
            exit 0
          fi

          pr_number="$EVENT_PR_NUMBER"

          body="$(mktemp)"
          {
            echo "$marker"
            echo "### Preview deployment"
            echo
            echo "**[Open the preview](${PREVIEW_URL})**"
            echo
            echo "| | |"
            echo "| :-- | :-- |"
            echo "| Preview URL | ${PREVIEW_URL} |"
            echo "| Preview alias | \`${PREVIEW_ALIAS}\` |"
            if [ -n "$VERSION_URL" ] && [ "$VERSION_URL" != "$PREVIEW_URL" ]; then
              echo "| This version only | ${VERSION_URL} |"
            fi
            echo "| Commit | \`${HEAD_SHA:0:7}\` |"
            echo
            echo "<sub>Add the \`preview\` label again to deploy the latest commit.</sub>"
          } > "$body"

          comment_id="$(gh api --paginate "repos/${GH_REPO}/issues/${pr_number}/comments" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" \
            | head -n 1)"

          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${comment_id}" -F body=@"$body" >/dev/null
            echo "Updated preview comment on pull request #${pr_number}."
          else
            gh api -X POST "repos/${GH_REPO}/issues/${pr_number}/comments" -F body=@"$body" >/dev/null
            echo "Created preview comment on pull request #${pr_number}."
          fi

      - name: Summarize preview upload
        if: github.event_name == 'pull_request'
        env:
          COMMAND_OUTPUT: ${{ steps.preview-deploy.outputs.command-output }}
          PREVIEW_ALIAS: ${{ steps.preview.outputs.alias }}
          PREVIEW_URL: ${{ steps.preview-url.outputs.preview-url }}
        run: |
          {
            echo "### Cloudflare preview upload"
            echo
            echo "Preview alias: \`${PREVIEW_ALIAS}\`"
            echo
            if [ -n "$PREVIEW_URL" ]; then
              echo "Preview URL: ${PREVIEW_URL}"
              echo
            fi
            echo '```'
            echo "$COMMAND_OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Taking the label off lets a person add it again for a newer commit. It
      # comes off after a failure too, so a retry is the same gesture.
      - name: Remove preview label
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/${GH_REPO}/issues/${PR_NUMBER}/labels/preview" --silent || true
