name: Weekly Docker Refresh

on:
  schedule:
    # Runs Sundays at 08:17 UTC. The offset minute avoids GitHub's top-of-hour load spike.
    - cron: "17 8 * * 0"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: weekly-docker-refresh
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build weekly image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: project-carlo-weekly:latest
          cache-from: type=gha,scope=weekly-job
          cache-to: type=gha,mode=max,scope=weekly-job

      - name: Run weekly pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          docker run --name project-carlo-weekly \
            -e GEMINI_API_KEY \
            project-carlo-weekly:latest

      - name: Copy generated outputs
        run: |
          docker cp project-carlo-weekly:/workspace/data/metadata.json data/metadata.json
          docker cp project-carlo-weekly:/workspace/data/events.json data/events.json
          # The recurrence detector's only memory of past bulletins. events.json is
          # compacted to the latest bulletin per parish every run, so without copying
          # this back out the evidence is gone and promotion silently stops working.
          docker cp project-carlo-weekly:/workspace/data/event_history.json data/event_history.json
          docker cp project-carlo-weekly:/workspace/apps/web/public/frontend.snapshot apps/web/public/frontend.snapshot
          docker rm project-carlo-weekly

      - name: Commit generated changes
        id: commit
        run: |
          generated=(data/metadata.json data/events.json data/event_history.json apps/web/public/frontend.snapshot)
          base="$(git rev-parse HEAD)"
          commit_date="$(date -u +%F)"

          # The branch can move during the long pipeline run (e.g. a merged PR), and a rejected push
          # would throw away this run's output, event_history.json included. So each attempt rebuilds
          # the commit on the latest remote tip: reset the index to it, keep the working tree, and
          # stage only the generated files. Only this job writes them, so the fresh output replaces
          # them whole instead of being rebased or merged, which could splice two JSON snapshots into
          # a file the pipeline never wrote. Every other path is taken from the remote tip as is.
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ]; then
              sleep $((5 * 2 ** (attempt - 2)))
            fi

            git fetch --quiet origin "$GITHUB_REF" || continue
            git reset --quiet FETCH_HEAD
            git add -- "${generated[@]}"

            if git diff --cached --quiet; then
              echo "No generated changes to commit."
              echo "committed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "chore: weekly data refresh ${commit_date}"

            if git push origin "HEAD:${GITHUB_REF}"; then
              if ! git diff --quiet "$base" HEAD~1 -- "${generated[@]}"; then
                echo "::warning::Generated files changed on ${GITHUB_REF_NAME} during the run; this run's output replaced them."
              fi
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt ${attempt} failed."
          done

          echo "::error::Could not push the weekly data refresh after 5 attempts."
          exit 1

      - name: Trigger deploy workflow
        if: steps.commit.outputs.committed == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pushes made with GITHUB_TOKEN do not trigger other workflows, so dispatch deploy explicitly.
          gh workflow run deploy-web.yml --ref "$GITHUB_REF_NAME" -f mode=deploy
