name: Publish Data Run

# Publish an uploaded weekly run: a held run a person has reviewed, or an
# earlier run to roll back to. Points pipeline/latest.json at the run and
# redeploys the site with its snapshot.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id to publish (from the weekly run's summary or issue)"
        required: true
        type: string

permissions: read-all

concurrency:
  group: weekly-docker-refresh
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version-file: .python-version

      - name: Install Python dependencies
        run: uv sync --frozen --no-dev

      - name: Publish run
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'project-carlo-data' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_WRITE_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_WRITE_SECRET_ACCESS_KEY }}
          CARLO_REMOTE_WRITE: "1"
          RUN_ID: ${{ inputs.run_id }}
        run: |
          uv run --no-sync python -m pdf_extract data promote --run-id "$RUN_ID" | tee published.json
          {
            echo "### Published \`${RUN_ID}\`"
            echo
            echo '```json'
            cat published.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy the published data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml --ref "${{ github.event.repository.default_branch }}" -f mode=deploy
